    <text x="24" y="56" font-family="'Inter', sans-serif" font-size="14" fill="#6b7280">QA Automation</text>
  </g>
  
  <g transform="translate(300, 430)">
    <rect width="200" height="70" rx="10" fill="#141820" stroke="#f59e0b" stroke-opacity="0.3"/>
    <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="bold" fill="#f59e0b">IEEE Xplore</text>
    <text x="24" y="56" font-family="'Inter', sans-serif" font-size="14" fill="#6b7280">Best Paper 2024</text>
